<div class="overlay" (click)="cancel()">
  <div
    class="confirm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    (click)="$event.stopPropagation()"
  >
    <h2 class="confirm__title" id="confirm-title">{{ title() }}</h2>

    <p class="confirm__body">
      <ng-content />
    </p>

    <footer class="confirm__actions">
      <button type="button" class="btn btn--ghost" [disabled]="busy()" (click)="cancel()">
        Cancelar
      </button>
      <button type="button" class="btn btn--danger" [disabled]="busy()" (click)="confirm()">
        {{ busy() ? busyLabel() : confirmLabel() }}
      </button>
    </footer>
  </div>
</div>
