<form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (banner(); as message) {
    <p class="form__failure" role="alert">{{ message }}</p>
  }

  @if (loading()) {
    <p class="form__status">Carregando nota fiscal…</p>
  } @else {
    <div class="form__grid">
      <div class="field-group field-group--number">
        <label class="field-label" for="number">Número</label>
        <input
          id="number"
          type="text"
          class="field"
          formControlName="number"
          autocomplete="off"
          maxlength="30"
          placeholder="NF-0001"
          [class.field--error]="fieldError('number')"
        />
        @if (fieldError('number'); as message) {
          <p class="field-error">{{ message }}</p>
        }
      </div>

      <div class="field-group">
        @if (typeEditable()) {
          <label class="field-label" for="type">Tipo</label>
          <select
            id="type"
            class="field"
            formControlName="type"
            [class.field--error]="fieldError('type')"
          >
            @for (type of types; track type) {
              <option [value]="type">{{ typeLabels[type] }}</option>
            }
          </select>
          @if (fieldError('type'); as message) {
            <p class="field-error">{{ message }}</p>
          }
        } @else {
          <span class="field-label">Tipo</span>
          <p class="field-static">{{ currentTypeLabel() }}</p>
        }
      </div>
    </div>

    <app-invoice-items-form
      [items]="items"
      [products]="products()"
      [productsFailed]="productsFailed()"
      [submitted]="submitted()"
    />
  }

  <footer class="form__actions">
    <a class="btn btn--ghost" routerLink="/billing/invoices">Cancelar</a>
    <button
      type="submit"
      class="btn btn--primary"
      [disabled]="saving() || loading()"
    >
      {{ saving() ? 'Salvando…' : submitLabel() }}
    </button>
  </footer>
</form>
