<section class="page">
  <header class="page__header">
    <div>
      <h1 class="page__title">Cadastrar nota fiscal</h1>
      <p class="page__subtitle">Faturamento &rsaquo; Notas Fiscais &rsaquo; Nova</p>
    </div>
  </header>

  <app-invoice-prompt
    [generating]="drafting()"
    [failure]="draftFailure()"
    [unresolved]="draft()?.unresolved ?? []"
    (generate)="generate($event)"
  />

  <app-invoice-form
    submitLabel="Salvar nota fiscal"
    [products]="products()"
    [productsFailed]="productsFailed()"
    [saving]="saving()"
    [failure]="failure()"
    [draft]="draft()"
    [suggestion]="suggestion()"
    (seriesChange)="suggestDocument($event)"
    (save)="create($event)"
  />
</section>
