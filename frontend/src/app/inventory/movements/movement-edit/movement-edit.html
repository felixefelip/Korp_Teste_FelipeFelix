<section class="page">
  <header class="page__header">
    <div>
      <h1 class="page__title">Editar movimentação</h1>
      <p class="page__subtitle">Estoque &rsaquo; Produtos &rsaquo; Movimentações</p>
    </div>
  </header>

  <app-movement-form
    submitLabel="Salvar alterações"
    [backLink]="backLink"
    [value]="movement()"
    [loading]="loading()"
    [saving]="saving()"
    [failure]="failure()"
    (save)="update($event)"
  />
</section>
