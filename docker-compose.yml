services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q check_running
      interval: 10s
      retries: 12

  inventory:
    build: ./inventory
    image: korp/inventory:dev
    init: true
    ports:
      - "8000:8000"
    environment:
      GO_ENV: ${GO_ENV:-development}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DB_HOST: inventory_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 1234
    volumes:
      - ./inventory:/go/src/app
      - gomodcache:/go/pkg/mod
    depends_on:
      inventory_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: sleep infinity

  inventory_db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres
      interval: 5s
      retries: 12

  billing:
    build: ./billing
    image: korp/billing:dev
    init: true
    ports:
      - "8001:8001"
    environment:
      GO_ENV: ${GO_ENV:-development}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DB_HOST: billing_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 1234
    volumes:
      - ./billing:/go/src/app
      - gomodcache:/go/pkg/mod
    depends_on:
      billing_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: sleep infinity

  billing_db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_USER: postgres
    ports:
      - "5434:5432"
    volumes:
      - billing_pgdata:/var/lib/postgresql
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres
      interval: 5s
      retries: 12

  finance:
    build: ./finance
    image: korp/finance:dev
    init: true
    ports:
      - "8002:8002"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8002
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ConnectionStrings__Finance: Server=finance_db,1433;Database=finance;User Id=sa;Password=Finance@1234;TrustServerCertificate=True
    volumes:
      - ./finance:/src
      - /src/bin
      - /src/obj
      - nugetcache:/root/.nuget/packages
    depends_on:
      finance_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: sleep infinity

  finance_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Finance@1234
    ports:
      - "1433:1433"
    volumes:
      - finance_mssqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b
      interval: 10s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    image: korp/frontend:dev
    environment:
      INVENTORY_API_URL: http://inventory:8000
      BILLING_API_URL: http://billing:8001
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - inventory
      - billing

volumes:
  rabbitmqdata: {}
  pgdata: {}
  billing_pgdata: {}
  gomodcache: {}
  finance_mssqldata: {}
  nugetcache: {}
